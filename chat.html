<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bargain & Messages | POSHAKH Royal Couture</title>
  <meta name="description" content="Direct negotiation and messaging between renters, boutique lenders, and admin support. Negotiate rental rates and request custom fittings.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .chat-page-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 2rem;
      padding: 7rem 0 5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .chat-threads-sidebar {
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      height: 650px;
      display: flex;
      flex-direction: column;
    }

    .thread-item {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid #f0e8d8;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      gap: 0.9rem;
      align-items: center;
    }

    .thread-item:hover, .thread-item.active {
      background: #FAF3E6;
    }

    .thread-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--gold-antique);
      flex-shrink: 0;
    }

    @media (max-width: 900px) {
      .chat-page-layout {
        grid-template-columns: 1fr;
        padding: 4.8rem 0 2rem;
        gap: 1.2rem;
      }
      .chat-threads-sidebar {
        height: auto;
        max-height: 220px;
      }
      .chat-main-window {
        height: 520px;
      }
    }
  </style>
</head>
<body>

  <!-- Universal Navbar Placeholder -->
  <div id="poshakh-nav-header"></div>

  <div class="container">
    <div class="chat-page-layout">
      
      <!-- LEFT: CONVERSATION THREADS -->
      <aside class="chat-threads-sidebar">
        <div style="padding: 1.2rem 1.4rem; border-bottom: 1px solid var(--border-gold); background: #FAF3E6;">
          <h2 style="font-size: 1.2rem; color: var(--wine-deep);">Conversations</h2>
          <span style="font-size: 0.75rem; color: var(--text-muted);">Direct negotiation &amp; boutique support</span>
        </div>

        <div id="threads-container" style="flex-grow: 1; overflow-y: auto;">
          <!-- Rendered dynamically via JavaScript -->
        </div>
      </aside>

      <!-- RIGHT: ACTIVE CHAT & BARGAIN ROOM -->
      <main id="chat-main-area">
        <div class="chat-window">
          
          <!-- Header -->
          <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 0.8rem;">
              <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=100&q=80" alt="Boutique" id="active-chat-avatar" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--gold-antique);">
              <div>
                <strong style="color: var(--wine-deep); font-size: 1.05rem;" id="active-chat-name">Select a Conversation</strong>
                <span class="badge badge-gold" id="active-chat-badge" style="font-size: 0.65rem; margin-left: 6px;">Verified Boutique</span>
                <div style="font-size: 0.75rem; color: #777;" id="active-chat-sub">Outfit Inquiry &amp; Custom Fitting</div>
              </div>
            </div>

            <!-- Bargain Trigger Button -->
            <button id="bargain-toggle-btn" onclick="toggleBargainBox()" class="btn btn-gold" style="padding: 0.45rem 1rem; font-size: 0.76rem;">
              🤝 Propose Price Bargain
            </button>
          </div>

          <!-- BARGAIN BOX (COUNTER-OFFER INPUT) -->
          <div id="bargain-box" style="display: none; padding: 1rem 1.8rem; background: #FFF9EE; border-bottom: 1px dashed var(--gold-antique);">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem;">
              <div>
                <strong style="color: var(--wine-deep); font-size: 0.9rem;">Make a Rental Price Counter-Offer</strong>
                <p style="font-size: 0.78rem; color: #666;" id="bargain-box-subtitle">Negotiate rental rate for celebration wear.</p>
              </div>

              <div style="display: flex; gap: 8px; align-items: center;">
                <span style="font-size: 0.85rem; font-weight: 700;">₹</span>
                <input type="number" id="bargain-price" value="3000" min="500" max="15000" step="100" style="width: 100px; padding: 0.4rem 0.6rem; border: 1px solid var(--border-gold); border-radius: var(--radius-sm); font-weight: 700;">
                <span style="font-size: 0.85rem; color: #666;">/ day</span>
                <button onclick="sendBargainOffer()" class="btn btn-crimson" style="padding: 0.45rem 1rem; font-size: 0.76rem;">
                  Send Offer
                </button>
              </div>
            </div>
          </div>

          <!-- Messages Stream -->
          <div class="chat-messages" id="messages-container">
            <!-- Populated dynamically via JS -->
          </div>

          <!-- Message Input Bar -->
          <form class="chat-input-bar" id="chat-input-form" onsubmit="handleSendChatMessage(event)">
            <input type="text" id="chat-text-input" class="form-input" placeholder="Type your message..." required style="background: #FBF7F0;">
            <button type="submit" class="btn btn-gold" style="padding: 0.85rem 1.6rem; font-size: 0.85rem;">
              Send
            </button>
          </form>

        </div>
      </main>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentChatId = null;

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Enforce Authentication (Guests cannot see or send chats)
      const currentUser = PoshakhStore.getCurrentUser();
      if (!currentUser) {
        alert('Please sign in to view your conversations or message royal boutiques.');
        window.location.href = 'login.html?redirect=chat.html';
        return;
      }

      loadConversations();
    });

    function loadConversations() {
      const currentUser = PoshakhStore.getCurrentUser();
      const urlParams = new URLSearchParams(window.location.search);
      const lenderParam = urlParams.get('lender');
      const dressParam = urlParams.get('dress');

      // Check if directed to initiate or open conversation with a specific boutique or admin
      if (lenderParam) {
        let targetEmail = '';
        let targetName = '';
        let targetAvatar = '';

        if (lenderParam === 'admin') {
          targetEmail = 'admin202@admin.com';
          targetName = 'Poshakh Super Admin Support';
          targetAvatar = 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=150&q=80';
        } else {
          const lender = PoshakhStore.getLenderById(lenderParam) || 
                         PoshakhStore.getLenders().find(l => l.email.toLowerCase() === lenderParam.toLowerCase());
          if (lender) {
            targetEmail = lender.email;
            targetName = lender.boutiqueName || lender.name;
            targetAvatar = lender.avatar;
          }
        }

        if (targetEmail) {
          // Prevent messaging oneself
          if (targetEmail.toLowerCase() === currentUser.email.toLowerCase()) {
            PoshakhUI.toast('You cannot message your own boutique!', 'gold');
          } else {
            const chat = PoshakhStore.getOrCreateChat(
              currentUser.email,
              targetEmail,
              targetName,
              targetAvatar,
              dressParam || 'Royal Couture Ensemble'
            );
            currentChatId = chat.id;
          }
        }
      }

      // Fetch user's actual conversations
      const userChats = PoshakhStore.getUserChats(currentUser.email);

      // If no target was specified, default to first conversation if available
      if (!currentChatId && userChats.length > 0) {
        currentChatId = userChats[0].id;
      }

      renderThreadsList(userChats);
      renderCurrentChat();
    }

    function renderThreadsList(chats) {
      const container = document.getElementById('threads-container');
      if (!container) return;

      if (!chats || chats.length === 0) {
        container.innerHTML = `
          <div style="padding: 3rem 1.2rem; text-align: center; color: var(--text-muted);">
            <span style="font-size: 2.2rem;">💬</span>
            <h4 style="font-size: 0.95rem; color: var(--wine-deep); margin: 0.8rem 0 0.3rem;">No Conversations Yet</h4>
            <p style="font-size: 0.78rem; line-height: 1.4; margin-bottom: 1rem;">
              Click "Message & Negotiate" on any boutique profile or bridal outfit to begin negotiating.
            </p>
            <a href="shop.html" class="btn btn-gold" style="font-size: 0.75rem; padding: 0.4rem 0.9rem;">Explore Outfits</a>
          </div>
        `;
        return;
      }

      const currentUser = PoshakhStore.getCurrentUser();

      container.innerHTML = chats.map(chat => {
        const isActive = chat.id === currentChatId;
        const lastMsg = chat.messages && chat.messages.length > 0 
          ? chat.messages[chat.messages.length - 1].text 
          : 'Conversation initiated. Send your inquiry...';
        const lastTime = chat.messages && chat.messages.length > 0
          ? chat.messages[chat.messages.length - 1].time
          : 'New';

        return `
          <div class="thread-item ${isActive ? 'active' : ''}" onclick="switchThread('${chat.id}')">
            <img src="${chat.targetAvatar || 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=150&q=80'}" alt="${chat.targetName}" class="thread-avatar">
            <div style="flex-grow: 1; overflow: hidden;">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <strong style="font-size: 0.9rem; color: var(--wine-deep);">${chat.targetName || 'Royal Boutique'}</strong>
                <span style="font-size: 0.65rem; color: #888;">${lastTime}</span>
              </div>
              <div style="font-size: 0.75rem; color: var(--gold-antique); font-weight: 600;">👗 ${chat.outfitName || 'Couture Inquiries'}</div>
              <p style="font-size: 0.74rem; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">
                ${lastMsg}
              </p>
            </div>
          </div>
        `;
      }).join('');
    }

    function switchThread(chatId) {
      currentChatId = chatId;
      const currentUser = PoshakhStore.getCurrentUser();
      const userChats = PoshakhStore.getUserChats(currentUser.email);
      renderThreadsList(userChats);
      renderCurrentChat();
    }

    function renderCurrentChat() {
      const container = document.getElementById('messages-container');
      if (!container) return;

      const chats = PoshakhStore.getChats();
      const chat = chats.find(c => c.id === currentChatId);

      if (!chat) {
        document.getElementById('active-chat-name').textContent = 'Select or Start a Conversation';
        document.getElementById('active-chat-sub').textContent = 'Direct messaging with verified royal boutiques';
        document.getElementById('bargain-toggle-btn').style.display = 'none';
        document.getElementById('chat-input-form').style.display = 'none';
        container.innerHTML = `
          <div style="text-align: center; padding: 6rem 2rem; color: var(--text-muted);">
            <span style="font-size: 3.5rem;">💌</span>
            <h3 style="font-size: 1.35rem; color: var(--wine-deep); margin: 1rem 0 0.5rem;">Your Inbox is Clean</h3>
            <p style="font-size: 0.88rem; max-width: 440px; margin: 0 auto 1.5rem;">
              You have no active message selected. You can start a rental bargain or size inquiry directly from any outfit page.
            </p>
            <a href="shop.html" class="btn btn-gold">Browse Royal Collection &rarr;</a>
          </div>
        `;
        return;
      }

      document.getElementById('bargain-toggle-btn').style.display = 'inline-block';
      document.getElementById('chat-input-form').style.display = 'flex';

      // Update Header
      document.getElementById('active-chat-name').textContent = chat.targetName || 'Royal Boutique';
      document.getElementById('active-chat-sub').textContent = `Outfit: ${chat.outfitName || 'Celebration Wear'}`;
      if (chat.targetAvatar) {
        document.getElementById('active-chat-avatar').src = chat.targetAvatar;
      }

      const currentUser = PoshakhStore.getCurrentUser();
      const myEmail = currentUser ? currentUser.email.toLowerCase() : '';

      // Clean state if no messages have been sent yet ("pela thi koi msg sent na jova joi")
      if (!chat.messages || chat.messages.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 4rem 2rem; margin: 2rem; background: #FAF5EB; border-radius: var(--radius-md); border: 1px dashed var(--gold-antique); color: var(--text-muted);">
            <span style="font-size: 2.8rem;">✨</span>
            <h3 style="font-size: 1.2rem; color: var(--wine-deep); margin: 0.8rem 0 0.4rem;">
              Start Conversation with ${chat.targetName || 'Royal Boutique'}
            </h3>
            <p style="font-size: 0.85rem; line-height: 1.5; max-width: 420px; margin: 0 auto 1.2rem;">
              No messages sent yet. Ask regarding custom blouse measurements, jewelry accessories, rental dates, or submit a price bargain below.
            </p>
            <button onclick="toggleBargainBox()" class="btn btn-outline" style="font-size: 0.78rem;">
              🤝 Make a Rental Counter-Offer
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = chat.messages.map(m => {
        const isMe = m.sender.toLowerCase() === myEmail;
        const isAdmin = m.sender.toLowerCase().includes('admin');

        let bubbleClass = 'chat-bubble ';
        if (isAdmin) bubbleClass += 'admin';
        else if (isMe) bubbleClass += 'renter';
        else bubbleClass += 'lender';

        return `
          <div class="${bubbleClass}">
            <div style="font-size: 0.72rem; font-weight: 700; opacity: 0.85; margin-bottom: 2px;">
              ${m.senderName}
            </div>
            <div>${m.text}</div>
            <div class="chat-time">${m.time}</div>
          </div>
        `;
      }).join('');

      container.scrollTop = container.scrollHeight;
    }

    function toggleBargainBox() {
      const box = document.getElementById('bargain-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function sendBargainOffer() {
      const price = document.getElementById('bargain-price').value;
      const currentUser = PoshakhStore.getCurrentUser();
      if (!currentUser || !currentChatId) return;

      const offerMsg = {
        sender: currentUser.email,
        senderName: currentUser.name,
        text: `🤝 Rental Bargain Offer: I would like to rent this outfit at ₹${Number(price).toLocaleString()}/day. Would you be able to accept this celebratory rate?`,
        time: 'Just now'
      };

      PoshakhStore.sendMessage(currentChatId, offerMsg);
      renderCurrentChat();
      toggleBargainBox();
      PoshakhUI.toast('Counter-offer sent to boutique!', 'success');

      const userChats = PoshakhStore.getUserChats(currentUser.email);
      renderThreadsList(userChats);
    }

    function handleSendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-text-input');
      const text = input.value.trim();
      if (!text) return;

      const currentUser = PoshakhStore.getCurrentUser();
      if (!currentUser || !currentChatId) return;

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgObj = {
        sender: currentUser.email,
        senderName: currentUser.name,
        text: text,
        time: timeStr
      };

      PoshakhStore.sendMessage(currentChatId, msgObj);
      input.value = '';
      renderCurrentChat();

      const userChats = PoshakhStore.getUserChats(currentUser.email);
      renderThreadsList(userChats);
    }
  </script>
</body>
</html>
